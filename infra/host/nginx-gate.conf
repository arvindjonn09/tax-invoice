# JobFlow gate (#326). Sits between the Cloudflare tunnel and the app on this
# host. It shows the maintenance page while the flag file exists and whenever
# the app can't be reached. Install: docs/ops/maintenance.md.

# Pages get HTML; API calls get JSON their callers can read.
map $request_uri $jobflow_unavailable_file {
    ~^/api(/|\?|$) index.json;
    default index.html;
}

server {
    # Loopback only: the tunnel is the only way in, so the client IP headers
    # it sets (CLIENT_IP_HEADER) can't be forged from outside.
    listen 127.0.0.1:3299;
    server_name _;
    server_tokens off;

    # The largest document upload (10 MiB) plus multipart overhead.
    client_max_body_size 11m;
    large_client_header_buffers 4 16k;

    # nginx's own 502 and 504 when the app is down. The app's own 5xx
    # responses pass through unchanged (proxy_intercept_errors stays off).
    # An error_page URI also turns a POST into a GET, so the file can be served.
    error_page 502 503 504 =503 /__jobflow_unavailable/$jobflow_unavailable_file;

    location ^~ /__jobflow_unavailable/ {
        internal;
        alias /usr/share/jobflow-maintenance/;
        types {
            text/html html;
            application/json json;
        }
        add_header Retry-After "120" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'" always;
    }

    location / {
        # Checked here, not at server level: a server-level check would run
        # again for the error page above and loop.
        if (-f /var/lib/jobflow-maintenance/on) {
            return 503;
        }
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Keep the host and everything the tunnel sent, including the client IP
        # headers, exactly as the app sees them today.
        proxy_set_header Host $http_host;
        proxy_read_timeout 120s;
        # Pages stream their loading states; don't hold them until they finish.
        proxy_buffering off;
        # Sign-in sets large cookies; a too-small buffer would look like an outage.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }
}
