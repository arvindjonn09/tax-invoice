# clamd for JobFlow staging (#136). Mounted read-only over the image's own
# /etc/clamav/clamd.conf. Keep the socket, user and path settings in line
# with the image (`docker run --rm --entrypoint cat <CLAMAV_IMAGE>
# /etc/clamav/clamd.conf`) when the image is upgraded.
Foreground yes
User clamav
PidFile /tmp/clamd.pid
LocalSocket /tmp/clamd.sock
TCPSocket 3310
DatabaseDirectory /var/lib/clamav
LogFile /var/log/clamav/clamd.log
LogTime yes

# Uploads are at most 10 MB (MAX_DOCUMENT_BYTES); anything longer is refused
# by clamd with an ERROR, which the app treats as "unavailable".
StreamMaxLength 12M
MaxFileSize 12M
MaxScanSize 50M
MaxThreads 10

# A file clamd can't fully check is never reported as clean: over-limit
# content comes back as Heuristics.Limits.Exceeded.* FOUND, which the app
# refuses as "couldn't be checked" (scanner.ts).
AlertExceedsMax yes

# Encrypted documents and archives: OWNER DECISION PENDING (#261). Real
# supplier invoices can be password-protected PDFs. Setting these to `yes`
# refuses them as "couldn't be checked" (Heuristics.Encrypted.*); `no` stores
# them scanned only as far as clamd can see.
AlertEncrypted no
AlertEncryptedArchive no
AlertEncryptedDoc no
