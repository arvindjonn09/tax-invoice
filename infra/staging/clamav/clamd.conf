# clamd for JobFlow staging (#136). Mounted read-only over the image's own
# /etc/clamav/clamd.conf. Keep the socket, user and path settings in line
# with the image (`docker run --rm --entrypoint cat <the pinned image>
# /etc/clamav/clamd.conf`) when the image is upgraded.
Foreground yes
# No "User": Compose already runs clamd as the clamav user, unprivileged.
PidFile /tmp/clamd.pid
LocalSocket /tmp/clamd.sock
TCPSocket 3310
DatabaseDirectory /var/lib/clamav
LogFile /var/log/clamav/clamd.log
LogTime yes

# Uploads are at most 10 MB (MAX_DOCUMENT_BYTES); anything longer is refused
# by clamd with an ERROR, which the app treats as "unavailable".
StreamMaxLength 12M
# MaxFileSize also caps what one decoded PDF stream may inflate to: a large
# vector page (a CAD plan) inflates far past its 10 MB upload, so it is set
# well above the upload limit (tested in CI with a 20 MB content stream).
MaxFileSize 64M
MaxScanSize 128M
MaxThreads 10
# Reload signatures that freshclam (a separate container) has updated.
SelfCheck 600

# A file clamd can't fully check is never reported as clean: over-limit
# content comes back as Heuristics.Limits.Exceeded.* FOUND, which the app
# refuses as "couldn't be checked" (scanner.ts).
AlertExceedsMax yes

# Encrypted documents and archives are refused (owner decision, 5 November
# 2026): they come back as Heuristics.Encrypted.* FOUND, which the app refuses
# as "couldn't be checked".
AlertEncrypted yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes
