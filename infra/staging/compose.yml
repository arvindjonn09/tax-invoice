# JobFlow staging (#64). Configuration only: nothing here deploys itself.
# Run on the staging host from the repository root:
#   docker compose -f infra/staging/compose.yml --env-file infra/staging/env/compose.env up -d --build
# See docs/ops/staging.md. Real values live only in infra/staging/env/*.env on
# the host (git-ignored); the *.env.example files document them.
name: jobflow-staging

# Bounded local logs for every service (the app logs redacted JSON lines).
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  postgres:
    <<: *logging
    image: postgres:16.15-bookworm
    restart: unless-stopped
    env_file: env/postgres.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  # One-off: migrations and the least-privilege grants, as the database owner.
  migrate:
    <<: *logging
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: migrate
    image: jobflow-migrate:staging
    env_file: env/migrate.env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  web:
    <<: *logging
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: runtime
    image: jobflow-web:staging
    restart: unless-stopped
    # DATABASE_URL here is the jobflow_web role: rows only, no DDL, no audit rewrites.
    env_file: env/web.env
    depends_on:
      migrate:
        condition: service_completed_successfully
    # No published ports: only nginx reaches the app.
    expose: ["3000"]
    networks: [data, edge]
    mem_limit: 1g
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  nginx:
    <<: *logging
    image: nginx:1.28.0-bookworm
    restart: unless-stopped
    env_file: env/nginx.env
    depends_on: [web]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/templates:/etc/nginx/templates:ro
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - acme_webroot:/var/www/acme:ro
    networks: [edge]
    security_opt: ["no-new-privileges:true"]

  # Nightly encrypted backup (#173), run on demand by the host timer:
  #   docker compose -f infra/staging/compose.yml --env-file infra/staging/env/compose.env \
  #     --profile backup run --rm backup
  # On the data network (reaches postgres) and edge (storage, off-site copy).
  backup:
    <<: *logging
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: backup
    image: jobflow-backup:staging
    profiles: [backup]
    env_file:
      - env/backup.env
      # The encryption key lives apart from the backups, root-managed.
      - path: /etc/jobflow/backup-key.env
        required: false
    volumes:
      - /var/backups/jobflow:/backups
    networks: [data, edge]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  # On-demand/daily document maintenance with separate DB/S3 credentials (#170).
  maintenance:
    <<: *logging
    image: jobflow-backup:staging
    profiles: [maintenance]
    env_file: env/maintenance.env
    command: ["pnpm", "--silent", "documents:cleanup"]
    networks: [data, edge]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  # Certificates (HTTP-01 via the webroot nginx serves). Run on demand:
  #   docker compose -f infra/staging/compose.yml --profile certbot run --rm certbot \
  #     certonly --webroot -w /var/www/acme -d "$JOBFLOW_DOMAIN" --email "$ACME_EMAIL" --agree-tos --no-eff-email
  certbot:
    image: certbot/certbot:v4.0.0
    profiles: [certbot]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme_webroot:/var/www/acme
    networks: [edge]

networks:
  # The database network has no route out.
  data:
    internal: true
  edge: {}

volumes:
  postgres_data:
  letsencrypt:
  acme_webroot:
