version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Australia/Sydney
    open-pull-requests-limit: 5
    groups:
      prisma:
        patterns: ["prisma", "@prisma/*"]
      next:
        patterns: ["next", "eslint-config-next", "@next/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Australia/Sydney
    open-pull-requests-limit: 5
    groups:
      # CodeQL's init and analyze steps must run the same version; updating
      # them in separate PRs fails static-analysis in both (#370, #374).
      codeql:
        patterns: ["github/codeql-action", "github/codeql-action/*"]
