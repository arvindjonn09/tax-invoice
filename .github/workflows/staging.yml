# Staging configuration checks (#64). Builds the images, runs the migrate
# image against a database with no route out, and validates the Compose and
# nginx files. The deploy job is off until the owner enables it
# (docs/ops/staging.md); only that job uses credentials.
name: Staging config
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Build the web runtime image
        run: docker build -f apps/web/Dockerfile --target runtime -t jobflow-web:ci .
      - name: Build the migrate image
        run: docker build -f apps/web/Dockerfile --target migrate -t jobflow-migrate:ci .
      - name: Migrate image runs offline as non-root against an empty database
        run: |
          docker network create --internal jobflow-ci-data
          docker run -d --name db --network jobflow-ci-data \
            -e POSTGRES_USER=jobflow_owner -e POSTGRES_PASSWORD=ci-owner-password -e POSTGRES_DB=jobflow \
            postgres:16.15-bookworm
          for i in $(seq 1 30); do
            docker exec db pg_isready -h 127.0.0.1 -U jobflow_owner -d jobflow && break
            sleep 2
          done
          docker run --rm --network jobflow-ci-data -e APP_ENV=staging \
            -e DATABASE_URL=postgresql://jobflow_owner:ci-owner-password@db:5432/jobflow \
            -e RUNTIME_DATABASE_PASSWORD="$(openssl rand -hex 32)" jobflow-migrate:ci
          docker exec db psql -U jobflow_owner -d jobflow -tAc \
            "SELECT pg_has_role('jobflow_web','jobflow_app','member')" | grep -qx t
          docker rm -f db
      - name: Build the backup image
        run: docker build -f apps/web/Dockerfile --target backup -t jobflow-backup:ci .
      - name: Backup image has pg_dump 16, runs non-root on a read-only filesystem
        run: |
          docker run --rm --entrypoint pg_dump jobflow-backup:ci --version | grep -E ' 16\.'
          test "$(docker run --rm --entrypoint id jobflow-backup:ci -u)" != "0"
          mkdir -p "$RUNNER_TEMP/backups/2026-01-01T000000Z" && chmod -R 777 "$RUNNER_TEMP/backups"
          docker run --rm --read-only --tmpfs /tmp -v "$RUNNER_TEMP/backups:/backups" \
            --entrypoint pnpm jobflow-backup:ci --silent backup:prune /backups --keep-daily 1 --keep-monthly 1
      - name: Runtime image runs as non-root and holds no source, tests or env files
        run: |
          test "$(docker run --rm --entrypoint id jobflow-web:ci -u)" != "0"
          docker run --rm --entrypoint sh jobflow-web:ci -c \
            'test -f apps/web/server.js && test ! -e tests && test ! -e docs && ! find / -xdev -name ".env" -o -name ".env.*" 2>/dev/null | grep -q .'
      - name: Image answers its health check without a database
        run: |
          docker run -d --name web -p 127.0.0.1:3000:3000 \
            -e APP_ENV=staging -e BETTER_AUTH_URL=https://staging.jobflow.invalid \
            -e BETTER_AUTH_SECRET="$(openssl rand -hex 32)" jobflow-web:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/api/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/api/health
          # Not ready without a database or storage.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health/ready)" = "503"
          docker rm -f web
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Compose file resolves with the example environment
        run: |
          for f in infra/staging/env/*.env.example; do cp "$f" "${f%.example}"; done
          docker compose -f infra/staging/compose.yml --env-file infra/staging/env/compose.env config --quiet
      - name: nginx accepts the rendered configuration
        run: |
          mkdir -p "$RUNNER_TEMP/le/live/staging.jobflow.invalid"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=staging.jobflow.invalid \
            -keyout "$RUNNER_TEMP/le/live/staging.jobflow.invalid/privkey.pem" \
            -out "$RUNNER_TEMP/le/live/staging.jobflow.invalid/fullchain.pem"
          docker run --rm --add-host web:127.0.0.1 \
            -e JOBFLOW_DOMAIN=staging.jobflow.invalid \
            -v "$PWD/infra/nginx/templates:/etc/nginx/templates:ro" \
            -v "$PWD/infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$RUNNER_TEMP/le:/etc/letsencrypt:ro" \
            nginx:1.28.0-bookworm sh -c '/docker-entrypoint.sh nginx -t'
  # Off until the owner turns it on: set the repository variable
  # STAGING_DEPLOY_ENABLED=true, the `staging` environment (with required
  # reviewers) and its secrets. See docs/ops/staging.md. Main only.
  deploy:
    needs: [images, config]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy this commit on the staging host
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          SSH_TARGET: ${{ secrets.STAGING_SSH_TARGET }}
          SHA: ${{ github.sha }}
        run: |
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$SSH_KEY" > ~/.ssh/staging && chmod 0600 ~/.ssh/staging
          # The host's forced command (infra/staging/deploy.sh) checks out
          # exactly this commit (the tip of main), builds, migrates, restarts.
          ssh -i ~/.ssh/staging -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o BatchMode=yes "$SSH_TARGET" "deploy $SHA"
      - name: Smoke test
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          for i in $(seq 1 30); do
            curl -fsS "$STAGING_URL/api/health/ready" && exit 0
            sleep 5
          done
          exit 1
