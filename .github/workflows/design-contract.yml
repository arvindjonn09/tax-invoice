name: Design specification contract
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  contrast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python scripts/check-design-contrast.py
      - run: python scripts/check-design-links.py
