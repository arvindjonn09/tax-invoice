name: Scaffold checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan complete Git history for secrets
        run: |
          sh scripts/ci/install-gitleaks.sh
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --log-opts=--all
  static-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: github/codeql-action/init@793b778da9c9275a0f276522b27cb5fc14bba279 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          output: codeql-results
      - name: Reject static-analysis findings
        run: node scripts/check-sarif.mjs codeql-results
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:validate
      - name: Create private development environment
        run: pnpm db:env
      - name: Build and start clean PostgreSQL and MinIO services
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Verify service health through the published endpoints
        run: |
          docker compose ps
          docker compose exec -T postgres sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
          curl --fail --silent --show-error http://127.0.0.1:9000/minio/health/ready
      - name: Apply migrations twice and verify guarded reset
        run: |
          pnpm db:migrate
          pnpm db:migrate
          RESET_TEST_DATABASE=yes pnpm db:test:reset
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm test:coverage
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Capture service diagnostics on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Stop local services
        if: always()
        run: docker compose down --volumes
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-report-${{ github.event_name }}
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: domain-coverage
          path: coverage/domain/
          retention-days: 14
      - name: Check audit exception review deadline
        run: |
          node --input-type=module -e 'if (new Date() >= new Date("2026-11-21T00:00:00+11:00")) throw new Error("Audit exception requires owner review: GHSA-vfj7-8cjw-p6xm")'
      - name: Audit production dependencies without exceptions
        run: pnpm audit:prod
      - name: Audit all dependencies with approved exception
        run: pnpm audit --audit-level high
  gate-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: sh scripts/ci/install-gitleaks.sh
      - name: Prove type, lint, test, audit and secret gates reject faults
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: node scripts/ci/prove-gates.mjs
