name: Scaffold checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan complete Git history for secrets
        run: |
          sh scripts/ci/install-gitleaks.sh
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --log-opts=--all
  static-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          output: codeql-results
      - name: Reject static-analysis findings
        run: node scripts/check-sarif.mjs codeql-results
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:validate
      - name: Create private development environment
        run: pnpm db:env
      - name: Build and start clean PostgreSQL and MinIO services
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Verify service health through the published endpoints
        run: |
          docker compose ps
          docker compose exec -T postgres sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
          curl --fail --silent --show-error http://127.0.0.1:9000/minio/health/ready
      - name: Apply migrations twice and verify guarded reset
        run: |
          pnpm db:migrate
          pnpm db:migrate
          RESET_TEST_DATABASE=yes pnpm db:test:reset
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm test:coverage
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Capture service diagnostics on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Stop local services
        if: always()
        run: docker compose down --volumes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-report-${{ github.event_name }}
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: domain-coverage
          path: coverage/domain/
          retention-days: 14
      - name: Audit production dependencies without exceptions
        run: pnpm audit:prod
      - name: Audit all dependencies without exceptions
        run: pnpm audit --audit-level high
  # #136: the upload scanner client against real clamd, from the same pinned
  # image and clamd.conf as staging (signatures are bundled in the image).
  clamav-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Start clamd (pinned image, staging clamd.conf, hardened as in compose.yml)
        run: |
          image=$(sed -n 's/^    image: \(clamav\/clamav:[^ ]*\)$/\1/p' infra/staging/compose.yml | head -n 1)
          case "$image" in clamav/clamav:*@sha256:*) ;; *) echo "clamav image not pinned" >&2; exit 1 ;; esac
          docker run -d --name clamd -p 127.0.0.1:3310:3310 \
            --user clamav --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:size=256m,mode=1777 --tmpfs /var/log/clamav:size=16m,mode=1777 \
            --tmpfs /run/clamav:size=1m,mode=1777 --memory 3g --pids-limit 256 \
            -v "$PWD/infra/staging/clamav/clamd.conf:/etc/clamav/clamd.conf:ro" \
            --entrypoint clamd "$image" --foreground --config-file=/etc/clamav/clamd.conf
          for i in $(seq 1 90); do
            if printf 'zPING\0' | timeout 3 nc 127.0.0.1 3310 2>/dev/null | grep -q PONG; then exit 0; fi
            sleep 5
          done
          docker logs clamd | tail -n 50
          exit 1
      # One step per case, so a failure names the case without the logs.
      - name: "Contract: fixtures, PING"
        env: { CLAMD_CONTRACT_HOST: 127.0.0.1 }
        run: pnpm exec vitest run --project unit tests/unit/clamd-contract.test.ts -t "fixtures|PING"
      - name: "Contract: raw EICAR found"
        env: { CLAMD_CONTRACT_HOST: 127.0.0.1 }
        run: pnpm exec vitest run --project unit tests/unit/clamd-contract.test.ts -t "sent as-is"
      - name: "Contract: EICAR attached inside a PDF found"
        env: { CLAMD_CONTRACT_HOST: 127.0.0.1 }
        run: pnpm exec vitest run --project unit tests/unit/clamd-contract.test.ts -t "attached inside"
      - name: "Contract: small PDF clean"
        env: { CLAMD_CONTRACT_HOST: 127.0.0.1 }
        run: pnpm exec vitest run --project unit tests/unit/clamd-contract.test.ts -t "well-formed PDF"
      - name: "Contract: large vector PDF clean"
        env: { CLAMD_CONTRACT_HOST: 127.0.0.1 }
        run: pnpm exec vitest run --project unit tests/unit/clamd-contract.test.ts -t "large vector"
      - name: "Contract: password-protected PDF refused"
        env: { CLAMD_CONTRACT_HOST: 127.0.0.1 }
        run: pnpm exec vitest run --project unit tests/unit/clamd-contract.test.ts -t "password-protected"
      - name: "Contract: over StreamMaxLength unavailable"
        env: { CLAMD_CONTRACT_HOST: 127.0.0.1 }
        run: pnpm exec vitest run --project unit tests/unit/clamd-contract.test.ts -t "StreamMaxLength"
      - if: failure()
        run: docker logs clamd 2>&1 | tail -n 100
  gate-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: sh scripts/ci/install-gitleaks.sh
      - name: Prove type, lint, test, audit and secret gates reject faults
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: node scripts/ci/prove-gates.mjs
