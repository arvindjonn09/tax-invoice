name: Domain research contract
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  research-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests/domain-rules -v
