name: Bug report
description: Something isn't working
labels: ["type:bug", "status:needs-info"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment / version / commit
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [critical, major, minor, trivial]
